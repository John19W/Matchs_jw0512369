name: Mise à jour des matchs
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les matchs et les résultats
        run: python update.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Enregistrer les changements
        run: |
          git config user.name "maj-auto"
          git config user.email "maj-auto@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Mise à jour des matchs" && git push)
